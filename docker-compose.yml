services:

  web:
    build: .
    container_name: skyline_web
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: skyline_db
    environment:
      POSTGRES_DB: skyline
      POSTGRES_USER: skyline
      POSTGRES_PASSWORD: skyline_password
    ports:
      - "5432:5432"
    volumes:
      - skyline_data:/var/lib/postgresql/data

volumes:
  skyline_data:
