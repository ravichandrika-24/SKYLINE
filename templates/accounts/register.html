<!DOCTYPE html>
<html>
<head>
    <title>SKYLINE Register</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #0b0b12;
            color: white;
        }

        .box {
            width: 400px;
            padding: 40px;
            background: #151520;
            border-radius: 20px;
            border: 1px solid #29293a;
        }

        .logo {
            text-align: center;
            color: #8b7cff;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        h1 {
            text-align: center;
        }

        input, select {
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            background: #0f0f18;
            border: 1px solid #333;
            border-radius: 10px;
            color: white;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 22px;
            border: 0;
            border-radius: 10px;
            background: #635bff;
            color: white;
            font-weight: bold;
        }

        a {
            color: #8b7cff;
            text-decoration: none;
        }

        #message {
            text-align: center;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="logo">SKYLINE</div>

    <h1>Create Account</h1>

    <form id="registerForm">

        <input
            id="username"
            placeholder="Username"
            required
        >

        <input
            id="email"
            type="email"
            placeholder="Email"
            required
        >

        <input
            id="password"
            type="password"
            placeholder="Password"
            required
        >

        <select id="role">

            <option value="CUSTOMER">
                Customer
            </option>

            <option value="EMPLOYEE">
                Employee
            </option>

            <option value="MANAGER">
                Manager
            </option>

        </select>

        <button type="submit">
            Create Account
        </button>

    </form>

    <p id="message"></p>

    <p>
        Already registered?
        <a href="/api/auth/login/">
            Login
        </a>
    </p>

</div>


<script>

document.getElementById("registerForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const response = await fetch(
        "/api/auth/register/",
        {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                username:
                    document.getElementById("username").value,

                email:
                    document.getElementById("email").value,

                password:
                    document.getElementById("password").value,

                role:
                    document.getElementById("role").value

            })
        }
    );

    const data = await response.json();

    if (response.ok) {

        document.getElementById("message")
        .innerText =
        "Account created! Redirecting...";

        setTimeout(function() {

            window.location.href =
                "/api/auth/login/";

        }, 700);

    } else {

        document.getElementById("message")
        .innerText =
        JSON.stringify(data);

    }

});

</script>

</body>
</html>
