<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKYLINE | Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b1020;
            color: white;
            font-family: Arial, sans-serif;
        }

        .box {
            width: 420px;
            padding: 40px;
            background: #151b32;
            border: 1px solid #293252;
            border-radius: 22px;
            box-shadow: 0 20px 60px rgba(0,0,0,.35);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #635bff;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #9da6c2;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border-radius: 10px;
            border: 1px solid #343d60;
            background: #0d1327;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #635bff;
        }

        button {
            width: 100%;
            padding: 15px;
            border: 0;
            border-radius: 10px;
            background: #635bff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5148e8;
        }

        #message {
            margin-bottom: 15px;
            color: #ff7188;
            text-align: center;
        }

        .register {
            text-align: center;
            margin-top: 25px;
            color: #9da6c2;
        }

        .register a {
            color: #635bff;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="logo">SKYLINE</div>

    <div class="subtitle">
        AI Business Operations Platform
    </div>

    <div id="message"></div>

    <form id="loginForm">

        <label>Username</label>
        <input
            type="text"
            id="username"
            placeholder="Enter username"
            required
        >

        <label>Password</label>
        <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <div class="register">
        Don't have an account?
        <a href="/api/auth/register-page/">Create account</a>
    </div>

</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    const message = document.getElementById("message");

    message.innerText = "Logging in...";

    try {

        const response = await fetch("/api/auth/login/", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                username: username,
                password: password
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error("Invalid username or password");
        }

        localStorage.setItem("access", data.access);
        localStorage.setItem("refresh", data.refresh);

        window.location.href = "/";

    } catch (error) {

        message.innerText = error.message;

    }

});
</script>

</body>
</html>
