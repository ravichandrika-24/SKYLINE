<!DOCTYPE html>
<html>
<head>
    <title>SKYLINE - Projects</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b1020;
            color: white;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 40px 20px;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #9ca3af;
            margin-bottom: 30px;
        }

        .form,
        .project {
            background: #151c32;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            border: 1px solid #303952;
            border-radius: 8px;
            background: #0f1528;
            color: white;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            background: #635bff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.85;
        }

        .status {
            color: #8b9cff;
        }

        #message {
            margin-top: 15px;
            color: #9ca3af;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🚀 SKYLINE Projects</h1>

    <p class="subtitle">
        Manage projects and track business progress.
    </p>

    <div class="form">

        <h2>Create Project</h2>

        <input
            id="name"
            type="text"
            placeholder="Project name"
        >

        <textarea
            id="description"
            placeholder="Project description"
        ></textarea>

        <select id="status">
            <option value="PLANNING">Planning</option>
            <option value="ACTIVE">Active</option>
            <option value="COMPLETED">Completed</option>
        </select>

        <input
            id="progress"
            type="number"
            min="0"
            max="100"
            value="0"
            placeholder="Progress %"
        >

        <button onclick="createProject()">
            Create Project
        </button>

        <div id="message"></div>

    </div>

    <h2>Projects</h2>

    <div id="projects">
        Loading projects...
    </div>

</div>


<script>

async function loadProjects() {

    const token = localStorage.getItem("access");

    if (!token) {
        document.getElementById("projects").innerHTML =
            "<p>Please login first.</p>";
        return;
    }

    const response = await fetch("/api/projects/", {
        headers: {
            "Authorization": "Bearer " + token
        }
    });

    if (!response.ok) {
        document.getElementById("projects").innerHTML =
            "<p>Unable to load projects.</p>";
        return;
    }

    const data = await response.json();

    const box = document.getElementById("projects");

    if (data.length === 0) {
        box.innerHTML = "<p>No projects yet.</p>";
        return;
    }

    box.innerHTML = "";

    data.forEach(project => {

        box.innerHTML += `
            <div class="project">

                <h3>${project.name}</h3>

                <p>${project.description || ""}</p>

                <p>
                    Status:
                    <span class="status">
                        ${project.status}
                    </span>
                </p>

                <p>
                    Progress:
                    <strong>${project.progress}%</strong>
                </p>

            </div>
        `;
    });
}


async function createProject() {

    const token = localStorage.getItem("access");

    if (!token) {
        document.getElementById("message").innerText =
            "Please login first.";
        return;
    }

    const name =
        document.getElementById("name").value;

    const description =
        document.getElementById("description").value;

    const status =
        document.getElementById("status").value;

    const progress =
        document.getElementById("progress").value;

    if (!name) {
        document.getElementById("message").innerText =
            "Enter project name.";
        return;
    }

    const response = await fetch("/api/projects/", {

        method: "POST",

        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
        },

        body: JSON.stringify({
            name: name,
            description: description,
            status: status,
            progress: progress
        })
    });

    if (response.ok) {

        document.getElementById("message").innerText =
            "✅ Project created successfully.";

        document.getElementById("name").value = "";
        document.getElementById("description").value = "";

        loadProjects();

    } else {

        const error = await response.json();

        document.getElementById("message").innerText =
            "❌ " + JSON.stringify(error);
    }
}


loadProjects();

</script>

</body>
</html>
